"en": {dir:"ltr", pick:"Language:", title:"PitchWhich — Privacy Policy", updated:"Last updated: 13 August 2026",
 intro:'PitchWhich (“the app”) is a soccer-tournament simulator. This policy explains how your information is handled. In short: <strong>the app runs entirely on your device, and we (the developer) do not collect, store, or have access to any personal information about you.</strong> The only data handling comes from third-party services used for advertising and payments, described below.',
 sec:[
 ["Information the developer collects","None. The app has no account or login, performs no analytics of its own, and does not send any of your information to the developer. All simulations run offline on your device."],
["Game Center (Apple)","Leaderboards use Apple’s Game Center. If you sign in, Apple handles your Game Center account and nickname; the app submits your run scores so they can be ranked, and reads the boards to display them. The developer receives no personal information through Game Center — Apple does, under its own policy ("+AP+"). Your best and saved runs are stored on your device only, and are never uploaded."],
 ["Advertising (Google AdMob)","The app shows ads through Google AdMob. To serve and measure ads, Google may collect and process information such as device identifiers, IP address, coarse location, and app-interaction data, and may use it to show personalized ads where permitted. Google’s handling of this data is governed by Google’s Privacy Policy ("+G1+") and “How Google uses information from sites or apps that use our services” ("+G2+")."],
 ["App Tracking Transparency (Apple)","On first launch, the app uses Apple’s App Tracking Transparency prompt to ask whether you allow tracking for advertising. If you decline, the ads you see are non-personalized. You can change this choice at any time in iOS <em>Settings → Privacy &amp; Security → Tracking</em>."],
 ["Consent (EEA, UK, and similar regions)","Where required by law (for example, under the GDPR in the EEA and UK), the app presents a Google-provided consent form at launch so you can make your choices about ad personalization before ads are shown."],
 ["In-app purchases","The “Remove Ads” purchase is a one-time in-app purchase processed entirely by Apple through the App Store. Apple handles all payment information; the developer never receives or stores your payment details. See Apple’s Privacy Policy ("+AP+")."],
 ["Children","The app is not directed to children under 13, and the developer does not knowingly collect personal information from children."],
 ["Your rights","Depending on where you live (for example, under the GDPR or the California CCPA/CPRA), you may have rights to access, correct, or delete personal data held about you. Because the developer holds no personal data, there is nothing for us to return, correct, or delete. For advertising data, please use the controls described above (decline tracking, or adjust your consent choices), and refer to Google’s and Apple’s policies linked above."],
 ["Data retention and security","The developer stores no personal data, so there is nothing retained on our side."],
 ["Changes to this policy","We may update this policy from time to time. Updates will be posted on this page with a new “Last updated” date."],
 ["Contact","Questions about this policy? Contact: "+EMAIL]],
 disc:"PitchWhich is an independent soccer simulation. It is not affiliated with, endorsed by, or sponsored by FIFA or any football organization, league, or club."},

"es": {dir:"ltr", pick:"Idioma:", title:"PitchWhich — Política de privacidad", updated:"Última actualización: 13 de agosto de 2026",
 intro:'PitchWhich («la app») es un simulador de torneos de fútbol. Esta política explica cómo se tratan tus datos. En resumen: <strong>la app funciona por completo en tu dispositivo y nosotros (el desarrollador) no recopilamos, almacenamos ni tenemos acceso a ninguna información personal sobre ti.</strong> El único tratamiento de datos proviene de servicios de terceros utilizados para publicidad y pagos, descritos a continuación.',
 sec:[
 ["Información que recopila el desarrollador","Ninguna. La app no tiene cuenta ni inicio de sesión, no realiza analíticas propias y no envía ninguna información tuya al desarrollador. Todas las simulaciones se ejecutan sin conexión en tu dispositivo."],
["Game Center (Apple)","Las clasificaciones usan Game Center de Apple. Si inicias sesión, Apple gestiona tu cuenta y tu apodo de Game Center; la app envía las puntuaciones de tus partidas para clasificarlas y lee las tablas para mostrarlas. El desarrollador no recibe ninguna información personal a través de Game Center; Apple sí, según su propia política ("+AP+"). Tus mejores partidas y las guardadas se almacenan solo en tu dispositivo y nunca se suben."],
 ["Publicidad (Google AdMob)","La app muestra anuncios a través de Google AdMob. Para mostrar y medir los anuncios, Google puede recopilar y procesar información como identificadores del dispositivo, dirección IP, ubicación aproximada y datos de interacción con la app, y puede usarla para mostrar anuncios personalizados cuando esté permitido. El tratamiento de estos datos por parte de Google se rige por la Política de privacidad de Google ("+G1+") y por «Cómo utiliza Google la información de sitios o apps que usan sus servicios» ("+G2+")."],
 ["Transparencia del seguimiento de apps (Apple)","En el primer inicio, la app utiliza el aviso de Transparencia del seguimiento de apps de Apple para preguntarte si permites el seguimiento con fines publicitarios. Si lo rechazas, los anuncios que veas no serán personalizados. Puedes cambiar esta elección en cualquier momento en <em>Ajustes → Privacidad y seguridad → Seguimiento</em> de iOS."],
 ["Consentimiento (EEE, Reino Unido y regiones similares)","Cuando la ley lo exige (por ejemplo, conforme al RGPD en el EEE y el Reino Unido), la app presenta un formulario de consentimiento proporcionado por Google al iniciarse, para que tomes tus decisiones sobre la personalización de anuncios antes de mostrarlos."],
 ["Compras dentro de la app","La compra «Quitar anuncios» es una compra única dentro de la app procesada íntegramente por Apple a través de la App Store. Apple gestiona toda la información de pago; el desarrollador nunca recibe ni almacena tus datos de pago. Consulta la Política de privacidad de Apple ("+AP+")."],
 ["Menores","La app no está dirigida a menores de 13 años y el desarrollador no recopila deliberadamente información personal de menores."],
 ["Tus derechos","Según dónde vivas (por ejemplo, conforme al RGPD o a la CCPA/CPRA de California), es posible que tengas derechos para acceder, corregir o eliminar los datos personales que se tengan sobre ti. Dado que el desarrollador no conserva datos personales, no hay nada que podamos devolver, corregir ni eliminar. Para los datos publicitarios, utiliza los controles descritos arriba (rechazar el seguimiento o ajustar tu consentimiento) y consulta las políticas de Google y Apple enlazadas arriba."],
 ["Conservación y seguridad de los datos","El desarrollador no almacena datos personales, por lo que no se conserva nada de nuestra parte."],
 ["Cambios en esta política","Podemos actualizar esta política de vez en cuando. Las actualizaciones se publicarán en esta página con una nueva fecha de «Última actualización»."],
 ["Contacto","¿Preguntas sobre esta política? Contacto: "+EMAIL]],
 disc:"PitchWhich es una simulación de fútbol independiente. No está afiliada, avalada ni patrocinada por la FIFA ni por ninguna organización, liga o club de fútbol."},

"fr": {dir:"ltr", pick:"Langue :", title:"PitchWhich — Politique de confidentialité", updated:"Dernière mise à jour : 13 août 2026",
 intro:'PitchWhich (« l’app ») est un simulateur de tournois de football. Cette politique explique comment vos informations sont traitées. En bref : <strong>l’app fonctionne entièrement sur votre appareil, et nous (le développeur) ne collectons, ne stockons ni n’avons accès à aucune information personnelle vous concernant.</strong> Le seul traitement de données provient de services tiers utilisés pour la publicité et les paiements, décrits ci-dessous.',
 sec:[
 ["Informations collectées par le développeur","Aucune. L’app n’a pas de compte ni de connexion, ne réalise aucune analyse propre et n’envoie aucune de vos informations au développeur. Toutes les simulations s’exécutent hors ligne sur votre appareil."],
["Game Center (Apple)","Les classements utilisent Game Center d’Apple. Si vous vous connectez, Apple gère votre compte et votre pseudo Game Center ; l’app envoie les scores de vos parties pour qu’ils soient classés et lit les classements pour les afficher. Le développeur ne reçoit aucune information personnelle via Game Center ; Apple oui, selon sa propre politique ("+AP+"). Vos meilleures parties et celles enregistrées restent sur votre appareil et ne sont jamais téléversées."],
 ["Publicité (Google AdMob)","L’app affiche des publicités via Google AdMob. Pour diffuser et mesurer les publicités, Google peut collecter et traiter des informations telles que les identifiants d’appareil, l’adresse IP, la localisation approximative et les données d’interaction avec l’app, et peut les utiliser pour afficher des publicités personnalisées lorsque cela est autorisé. Le traitement de ces données par Google est régi par la Politique de confidentialité de Google ("+G1+") et par « Comment Google utilise les informations provenant de sites ou d’applications qui utilisent ses services » ("+G2+")."],
 ["Transparence du suivi des apps (Apple)","Au premier lancement, l’app utilise l’invite de Transparence du suivi des apps d’Apple pour vous demander si vous autorisez le suivi à des fins publicitaires. Si vous refusez, les publicités affichées ne sont pas personnalisées. Vous pouvez modifier ce choix à tout moment dans <em>Réglages → Confidentialité et sécurité → Suivi</em> d’iOS."],
 ["Consentement (EEE, Royaume-Uni et régions similaires)","Lorsque la loi l’exige (par exemple au titre du RGPD dans l’EEE et au Royaume-Uni), l’app présente au lancement un formulaire de consentement fourni par Google afin que vous puissiez faire vos choix concernant la personnalisation des publicités avant leur affichage."],
 ["Achats intégrés","L’achat « Sans publicité » est un achat intégré unique traité entièrement par Apple via l’App Store. Apple gère toutes les informations de paiement ; le développeur ne reçoit ni ne stocke jamais vos données de paiement. Consultez la Politique de confidentialité d’Apple ("+AP+")."],
 ["Enfants","L’app ne s’adresse pas aux enfants de moins de 13 ans et le développeur ne collecte pas sciemment d’informations personnelles auprès d’enfants."],
 ["Vos droits","Selon votre lieu de résidence (par exemple au titre du RGPD ou de la CCPA/CPRA de Californie), vous pouvez disposer de droits d’accès, de rectification ou de suppression des données personnelles vous concernant. Comme le développeur ne détient aucune donnée personnelle, il n’y a rien à vous restituer, corriger ou supprimer. Pour les données publicitaires, utilisez les contrôles décrits ci-dessus (refuser le suivi ou ajuster votre consentement) et reportez-vous aux politiques de Google et d’Apple liées ci-dessus."],
 ["Conservation et sécurité des données","Le développeur ne stocke aucune donnée personnelle ; rien n’est donc conservé de notre côté."],
 ["Modifications de cette politique","Nous pouvons mettre à jour cette politique de temps à autre. Les mises à jour seront publiées sur cette page avec une nouvelle date de « Dernière mise à jour »."],
 ["Contact","Des questions sur cette politique ? Contact : "+EMAIL]],
 disc:"PitchWhich est une simulation de football indépendante. Elle n’est ni affiliée à la FIFA ou à une quelconque organisation, ligue ou club de football, ni approuvée ou sponsorisée par ceux-ci."},

"de": {dir:"ltr", pick:"Sprache:", title:"PitchWhich — Datenschutzrichtlinie", updated:"Zuletzt aktualisiert: 13. August 2026",
 intro:'PitchWhich („die App“) ist ein Fußballturnier-Simulator. Diese Richtlinie erklärt, wie deine Daten behandelt werden. Kurz gesagt: <strong>Die App läuft vollständig auf deinem Gerät, und wir (der Entwickler) erfassen, speichern oder haben keinen Zugriff auf personenbezogene Daten über dich.</strong> Die einzige Datenverarbeitung stammt von Drittanbieterdiensten für Werbung und Zahlungen, die unten beschrieben werden.',
 sec:[
 ["Vom Entwickler erfasste Daten","Keine. Die App hat kein Konto und keine Anmeldung, führt keine eigene Analyse durch und sendet keine deiner Daten an den Entwickler. Alle Simulationen laufen offline auf deinem Gerät."],
["Game Center (Apple)","Die Ranglisten nutzen Apples Game Center. Wenn Sie sich anmelden, verwaltet Apple Ihr Game-Center-Konto und Ihren Namen; die App übermittelt die Punktzahlen Ihrer Durchgänge zur Wertung und liest die Ranglisten, um sie anzuzeigen. Der Entwickler erhält über Game Center keine personenbezogenen Daten; Apple schon, nach seiner eigenen Richtlinie ("+AP+"). Ihre besten und gespeicherten Durchgänge liegen nur auf Ihrem Gerät und werden nie hochgeladen."],
 ["Werbung (Google AdMob)","Die App zeigt Werbung über Google AdMob an. Zur Auslieferung und Messung von Anzeigen kann Google Daten wie Gerätekennungen, IP-Adresse, ungefähren Standort und App-Interaktionsdaten erfassen und verarbeiten und diese, sofern zulässig, zur Anzeige personalisierter Werbung verwenden. Der Umgang von Google mit diesen Daten unterliegt der Datenschutzerklärung von Google ("+G1+") und „Wie Google Daten von Websites oder Apps verwendet, die seine Dienste nutzen“ ("+G2+")."],
 ["App-Tracking-Transparenz (Apple)","Beim ersten Start verwendet die App die App-Tracking-Transparenz-Abfrage von Apple, um dich zu fragen, ob du Tracking zu Werbezwecken erlaubst. Wenn du ablehnst, ist die angezeigte Werbung nicht personalisiert. Du kannst diese Wahl jederzeit unter iOS <em>Einstellungen → Datenschutz &amp; Sicherheit → Tracking</em> ändern."],
 ["Einwilligung (EWR, UK und ähnliche Regionen)","Wo gesetzlich vorgeschrieben (zum Beispiel gemäß der DSGVO im EWR und in Großbritannien), zeigt die App beim Start ein von Google bereitgestelltes Einwilligungsformular an, damit du deine Entscheidungen zur Werbepersonalisierung triffst, bevor Anzeigen erscheinen."],
 ["In-App-Käufe","Der Kauf „Werbung entfernen“ ist ein einmaliger In-App-Kauf, der vollständig von Apple über den App Store abgewickelt wird. Apple verwaltet alle Zahlungsinformationen; der Entwickler erhält oder speichert deine Zahlungsdaten niemals. Siehe die Datenschutzrichtlinie von Apple ("+AP+")."],
 ["Kinder","Die App richtet sich nicht an Kinder unter 13 Jahren, und der Entwickler erfasst nicht wissentlich personenbezogene Daten von Kindern."],
 ["Deine Rechte","Je nach Wohnort (zum Beispiel gemäß der DSGVO oder der kalifornischen CCPA/CPRA) hast du möglicherweise das Recht, auf über dich gespeicherte personenbezogene Daten zuzugreifen, sie zu berichtigen oder zu löschen. Da der Entwickler keine personenbezogenen Daten speichert, gibt es nichts, was wir herausgeben, berichtigen oder löschen könnten. Nutze für Werbedaten die oben beschriebenen Einstellungen (Tracking ablehnen oder Einwilligung anpassen) und beachte die oben verlinkten Richtlinien von Google und Apple."],
 ["Datenaufbewahrung und Sicherheit","Der Entwickler speichert keine personenbezogenen Daten, sodass auf unserer Seite nichts aufbewahrt wird."],
 ["Änderungen dieser Richtlinie","Wir können diese Richtlinie von Zeit zu Zeit aktualisieren. Aktualisierungen werden auf dieser Seite mit einem neuen Datum „Zuletzt aktualisiert“ veröffentlicht."],
 ["Kontakt","Fragen zu dieser Richtlinie? Kontakt: "+EMAIL]],
 disc:"PitchWhich ist eine unabhängige Fußballsimulation. Sie ist nicht mit der FIFA oder einer anderen Fußballorganisation, Liga oder einem Verein verbunden, von ihnen unterstützt oder gesponsert."},

"it": {dir:"ltr", pick:"Lingua:", title:"PitchWhich — Informativa sulla privacy", updated:"Ultimo aggiornamento: 13 agosto 2026",
 intro:'PitchWhich («l’app») è un simulatore di tornei di calcio. Questa informativa spiega come vengono trattati i tuoi dati. In breve: <strong>l’app funziona interamente sul tuo dispositivo e noi (lo sviluppatore) non raccogliamo, conserviamo né abbiamo accesso ad alcuna informazione personale su di te.</strong> L’unico trattamento dei dati proviene da servizi di terze parti utilizzati per pubblicità e pagamenti, descritti di seguito.',
 sec:[
 ["Informazioni raccolte dallo sviluppatore","Nessuna. L’app non ha account né accesso, non esegue analisi proprie e non invia alcuna tua informazione allo sviluppatore. Tutte le simulazioni vengono eseguite offline sul tuo dispositivo."],
["Game Center (Apple)","Le classifiche usano Game Center di Apple. Se accedi, Apple gestisce il tuo account e il tuo nickname Game Center; l’app invia i punteggi delle tue partite per classificarli e legge le classifiche per mostrarle. Lo sviluppatore non riceve alcuna informazione personale tramite Game Center; Apple sì, secondo la propria policy ("+AP+"). Le tue partite migliori e quelle salvate restano solo sul tuo dispositivo e non vengono mai caricate."],
 ["Pubblicità (Google AdMob)","L’app mostra annunci tramite Google AdMob. Per pubblicare e misurare gli annunci, Google può raccogliere ed elaborare informazioni come identificatori del dispositivo, indirizzo IP, posizione approssimativa e dati di interazione con l’app, e può utilizzarle per mostrare annunci personalizzati ove consentito. Il trattamento di questi dati da parte di Google è disciplinato dall’Informativa sulla privacy di Google ("+G1+") e da «Come Google utilizza le informazioni provenienti da siti o app che utilizzano i suoi servizi» ("+G2+")."],
 ["Trasparenza del tracciamento delle app (Apple)","Al primo avvio, l’app utilizza la richiesta di Trasparenza del tracciamento delle app di Apple per chiederti se consenti il tracciamento a fini pubblicitari. Se rifiuti, gli annunci che vedi non sono personalizzati. Puoi modificare questa scelta in qualsiasi momento in <em>Impostazioni → Privacy e sicurezza → Tracciamento</em> di iOS."],
 ["Consenso (SEE, Regno Unito e regioni simili)","Ove richiesto dalla legge (ad esempio ai sensi del GDPR nel SEE e nel Regno Unito), all’avvio l’app presenta un modulo di consenso fornito da Google affinché tu possa effettuare le tue scelte sulla personalizzazione degli annunci prima che vengano mostrati."],
 ["Acquisti in-app","L’acquisto «Rimuovi pubblicità» è un acquisto in-app una tantum gestito interamente da Apple tramite l’App Store. Apple gestisce tutte le informazioni di pagamento; lo sviluppatore non riceve né conserva mai i tuoi dati di pagamento. Consulta l’Informativa sulla privacy di Apple ("+AP+")."],
 ["Bambini","L’app non è destinata ai bambini di età inferiore ai 13 anni e lo sviluppatore non raccoglie consapevolmente informazioni personali da bambini."],
 ["I tuoi diritti","A seconda di dove vivi (ad esempio ai sensi del GDPR o della CCPA/CPRA della California), potresti avere il diritto di accedere, correggere o eliminare i dati personali che ti riguardano. Poiché lo sviluppatore non conserva dati personali, non c’è nulla da restituire, correggere o eliminare. Per i dati pubblicitari, utilizza i controlli descritti sopra (rifiutare il tracciamento o modificare il consenso) e consulta le informative di Google e Apple collegate sopra."],
 ["Conservazione e sicurezza dei dati","Lo sviluppatore non memorizza dati personali, quindi non viene conservato nulla da parte nostra."],
 ["Modifiche a questa informativa","Potremmo aggiornare questa informativa di tanto in tanto. Gli aggiornamenti saranno pubblicati su questa pagina con una nuova data di «Ultimo aggiornamento»."],
 ["Contatto","Domande su questa informativa? Contatto: "+EMAIL]],
 disc:"PitchWhich è una simulazione di calcio indipendente. Non è affiliata, approvata né sponsorizzata dalla FIFA o da alcuna organizzazione, lega o club calcistico."},

"pt": {dir:"ltr", pick:"Idioma:", title:"PitchWhich — Política de Privacidade", updated:"Última atualização: 13 de agosto de 2026",
 intro:'PitchWhich («o app») é um simulador de torneios de futebol. Esta política explica como os seus dados são tratados. Em resumo: <strong>o app funciona inteiramente no seu dispositivo e nós (o desenvolvedor) não coletamos, armazenamos nem temos acesso a nenhuma informação pessoal sobre você.</strong> O único tratamento de dados vem de serviços de terceiros usados para publicidade e pagamentos, descritos a seguir.',
 sec:[
 ["Informações que o desenvolvedor coleta","Nenhuma. O app não tem conta nem login, não realiza análises próprias e não envia nenhuma informação sua ao desenvolvedor. Todas as simulações são executadas offline no seu dispositivo."],
["Game Center (Apple)","As classificações usam o Game Center da Apple. Se você entrar, a Apple gerencia sua conta e seu apelido do Game Center; o app envia as pontuações das suas partidas para serem classificadas e lê as tabelas para exibi-las. O desenvolvedor não recebe nenhuma informação pessoal pelo Game Center; a Apple recebe, conforme a política dela ("+AP+"). Suas melhores partidas e as salvas ficam apenas no seu dispositivo e nunca são enviadas."],
 ["Publicidade (Google AdMob)","O app exibe anúncios por meio do Google AdMob. Para exibir e medir anúncios, o Google pode coletar e processar informações como identificadores do dispositivo, endereço IP, localização aproximada e dados de interação com o app, e pode usá-las para exibir anúncios personalizados quando permitido. O tratamento desses dados pelo Google é regido pela Política de Privacidade do Google ("+G1+") e por «Como o Google usa informações de sites ou apps que utilizam nossos serviços» ("+G2+")."],
 ["Transparência de rastreamento de apps (Apple)","No primeiro início, o app usa o aviso de Transparência de Rastreamento de Apps da Apple para perguntar se você permite o rastreamento para publicidade. Se você recusar, os anúncios exibidos não serão personalizados. Você pode alterar essa escolha a qualquer momento em <em>Ajustes → Privacidade e Segurança → Rastreamento</em> do iOS."],
 ["Consentimento (EEE, Reino Unido e regiões semelhantes)","Quando exigido por lei (por exemplo, sob o RGPD no EEE e no Reino Unido), o app apresenta no início um formulário de consentimento fornecido pelo Google para que você faça suas escolhas sobre a personalização de anúncios antes que eles sejam exibidos."],
 ["Compras no app","A compra «Remover anúncios» é uma compra única no app processada inteiramente pela Apple por meio da App Store. A Apple gerencia todas as informações de pagamento; o desenvolvedor nunca recebe nem armazena seus dados de pagamento. Consulte a Política de Privacidade da Apple ("+AP+")."],
 ["Crianças","O app não é direcionado a crianças menores de 13 anos, e o desenvolvedor não coleta intencionalmente informações pessoais de crianças."],
 ["Seus direitos","Dependendo de onde você mora (por exemplo, sob o RGPD ou a CCPA/CPRA da Califórnia), você pode ter direitos de acessar, corrigir ou excluir dados pessoais mantidos sobre você. Como o desenvolvedor não mantém dados pessoais, não há nada para devolvermos, corrigirmos ou excluirmos. Para dados de publicidade, use os controles descritos acima (recusar o rastreamento ou ajustar seu consentimento) e consulte as políticas do Google e da Apple vinculadas acima."],
 ["Retenção e segurança dos dados","O desenvolvedor não armazena dados pessoais, portanto nada é retido do nosso lado."],
 ["Alterações nesta política","Podemos atualizar esta política de tempos em tempos. As atualizações serão publicadas nesta página com uma nova data de «Última atualização»."],
 ["Contato","Dúvidas sobre esta política? Contato: "+EMAIL]],
 disc:"PitchWhich é uma simulação de futebol independente. Não é afiliada, endossada nem patrocinada pela FIFA ou por qualquer organização, liga ou clube de futebol."},

"nl": {dir:"ltr", pick:"Taal:", title:"PitchWhich — Privacybeleid", updated:"Laatst bijgewerkt: 13 augustus 2026",
 intro:'PitchWhich (“de app”) is een simulator voor voetbaltoernooien. Dit beleid legt uit hoe je gegevens worden verwerkt. Kort gezegd: <strong>de app draait volledig op je apparaat en wij (de ontwikkelaar) verzamelen, bewaren of hebben geen toegang tot enige persoonlijke informatie over jou.</strong> De enige gegevensverwerking komt van diensten van derden die worden gebruikt voor advertenties en betalingen, hieronder beschreven.',
 sec:[
 ["Informatie die de ontwikkelaar verzamelt","Geen. De app heeft geen account of login, voert geen eigen analyses uit en stuurt geen van je gegevens naar de ontwikkelaar. Alle simulaties draaien offline op je apparaat."],
["Game Center (Apple)","De klassementen gebruiken Game Center van Apple. Als je inlogt, beheert Apple je Game Center-account en je bijnaam; de app stuurt de scores van je speelrondes op zodat ze gerangschikt kunnen worden, en leest de klassementen om ze te tonen. De ontwikkelaar ontvangt via Game Center geen persoonlijke informatie; Apple wel, volgens haar eigen beleid ("+AP+"). Je beste en bewaarde speelrondes staan alleen op je apparaat en worden nooit geüpload."],
 ["Advertenties (Google AdMob)","De app toont advertenties via Google AdMob. Om advertenties weer te geven en te meten, kan Google informatie verzamelen en verwerken zoals apparaat-ID’s, IP-adres, grove locatie en app-interactiegegevens, en deze gebruiken om waar toegestaan gepersonaliseerde advertenties te tonen. De verwerking van deze gegevens door Google valt onder het privacybeleid van Google ("+G1+") en “Hoe Google gegevens gebruikt van sites of apps die onze services gebruiken” ("+G2+")."],
 ["App-trackingtransparantie (Apple)","Bij de eerste keer opstarten gebruikt de app het App-trackingtransparantie-verzoek van Apple om te vragen of je tracking voor advertenties toestaat. Als je weigert, zijn de advertenties die je ziet niet-gepersonaliseerd. Je kunt deze keuze op elk moment wijzigen in iOS <em>Instellingen → Privacy en beveiliging → Tracking</em>."],
 ["Toestemming (EER, VK en soortgelijke regio’s)","Waar wettelijk vereist (bijvoorbeeld onder de AVG in de EER en het VK) toont de app bij het opstarten een door Google geleverd toestemmingsformulier, zodat je je keuzes over advertentiepersonalisatie kunt maken voordat advertenties worden getoond."],
 ["In-app-aankopen","De aankoop “Advertenties verwijderen” is een eenmalige in-app-aankoop die volledig door Apple via de App Store wordt afgehandeld. Apple beheert alle betalingsgegevens; de ontwikkelaar ontvangt of bewaart nooit je betalingsgegevens. Zie het privacybeleid van Apple ("+AP+")."],
 ["Kinderen","De app is niet gericht op kinderen jonger dan 13 jaar en de ontwikkelaar verzamelt niet bewust persoonlijke informatie van kinderen."],
 ["Je rechten","Afhankelijk van waar je woont (bijvoorbeeld onder de AVG of de Californische CCPA/CPRA) heb je mogelijk het recht om persoonsgegevens over jou in te zien, te corrigeren of te verwijderen. Omdat de ontwikkelaar geen persoonsgegevens bewaart, is er niets voor ons om terug te geven, te corrigeren of te verwijderen. Gebruik voor advertentiegegevens de hierboven beschreven instellingen (tracking weigeren of je toestemming aanpassen) en raadpleeg het hierboven gelinkte beleid van Google en Apple."],
 ["Gegevensbewaring en beveiliging","De ontwikkelaar bewaart geen persoonsgegevens, dus er wordt aan onze kant niets bewaard."],
 ["Wijzigingen in dit beleid","We kunnen dit beleid van tijd tot tijd bijwerken. Updates worden op deze pagina geplaatst met een nieuwe datum “Laatst bijgewerkt”."],
 ["Contact","Vragen over dit beleid? Contact: "+EMAIL]],
 disc:"PitchWhich is een onafhankelijke voetbalsimulatie. Ze is niet verbonden met, goedgekeurd door of gesponsord door de FIFA of enige voetbalorganisatie, competitie of club."},

"ru": {dir:"ltr", pick:"Язык:", title:"PitchWhich — Политика конфиденциальности", updated:"Последнее обновление: 13 августа 2026 г.",
 intro:'PitchWhich («приложение») — это симулятор футбольных турниров. Эта политика объясняет, как обрабатываются ваши данные. Кратко: <strong>приложение работает полностью на вашем устройстве, и мы (разработчик) не собираем, не храним и не имеем доступа к какой-либо личной информации о вас.</strong> Единственная обработка данных осуществляется сторонними сервисами, используемыми для рекламы и платежей, описанными ниже.',
 sec:[
 ["Какие данные собирает разработчик","Никакие. В приложении нет учётной записи или входа, оно не ведёт собственную аналитику и не передаёт разработчику никаких ваших данных. Все симуляции выполняются офлайн на вашем устройстве."],
["Game Center (Apple)","Рейтинги используют Game Center от Apple. Если вы войдёте, Apple управляет вашей учётной записью и псевдонимом в Game Center; приложение отправляет результаты ваших прохождений для ранжирования и читает таблицы, чтобы их показать. Разработчик не получает через Game Center никаких персональных данных; их получает Apple, согласно своей политике ("+AP+"). Ваши лучшие и сохранённые прохождения хранятся только на устройстве и никогда не выгружаются."],
 ["Реклама (Google AdMob)","Приложение показывает рекламу через Google AdMob. Для показа и измерения рекламы Google может собирать и обрабатывать такие данные, как идентификаторы устройства, IP-адрес, приблизительное местоположение и данные о взаимодействии с приложением, и использовать их для показа персонализированной рекламы там, где это разрешено. Обработка этих данных компанией Google регулируется Политикой конфиденциальности Google ("+G1+") и разделом «Как Google использует информацию с сайтов и приложений, использующих наши сервисы» ("+G2+")."],
 ["Прозрачность отслеживания приложений (Apple)","При первом запуске приложение использует запрос Прозрачности отслеживания приложений Apple, чтобы спросить, разрешаете ли вы отслеживание для рекламы. Если вы откажетесь, показываемая реклама будет неперсонализированной. Вы можете изменить этот выбор в любое время в iOS: <em>Настройки → Конфиденциальность и безопасность → Отслеживание</em>."],
 ["Согласие (ЕЭЗ, Великобритания и аналогичные регионы)","Там, где этого требует закон (например, согласно GDPR в ЕЭЗ и Великобритании), при запуске приложение показывает форму согласия, предоставленную Google, чтобы вы могли сделать выбор относительно персонализации рекламы до её показа."],
 ["Покупки в приложении","Покупка «Убрать рекламу» — это разовая покупка в приложении, полностью обрабатываемая Apple через App Store. Apple обрабатывает все платёжные данные; разработчик никогда не получает и не хранит ваши платёжные данные. См. Политику конфиденциальности Apple ("+AP+")."],
 ["Дети","Приложение не предназначено для детей младше 13 лет, и разработчик сознательно не собирает личную информацию у детей."],
 ["Ваши права","В зависимости от места проживания (например, согласно GDPR или CCPA/CPRA штата Калифорния) у вас могут быть права на доступ, исправление или удаление хранящихся о вас личных данных. Поскольку разработчик не хранит личных данных, нам нечего возвращать, исправлять или удалять. Для рекламных данных используйте описанные выше средства управления (отказ от отслеживания или изменение согласия) и обращайтесь к политикам Google и Apple, ссылки на которые приведены выше."],
 ["Хранение и безопасность данных","Разработчик не хранит личных данных, поэтому с нашей стороны ничего не сохраняется."],
 ["Изменения в этой политике","Мы можем время от времени обновлять эту политику. Обновления будут публиковаться на этой странице с новой датой «Последнее обновление»."],
 ["Контакты","Вопросы по этой политике? Контакт: "+EMAIL]],
 disc:"PitchWhich — независимая футбольная симуляция. Она не связана с ФИФА или любой футбольной организацией, лигой или клубом, не одобрена и не спонсируется ими."},

"ja": {dir:"ltr", pick:"言語：", title:"PitchWhich — プライバシーポリシー", updated:"最終更新：2026年8月13日",
 intro:'PitchWhich（以下「本アプリ」）はサッカートーナメントのシミュレーターです。本ポリシーは、お客様の情報の取り扱いについて説明します。要約すると、<strong>本アプリは完全にお客様のデバイス上で動作し、当社（開発者）はお客様に関するいかなる個人情報も収集、保存、またはアクセスしません。</strong>唯一のデータ処理は、広告および決済に使用される第三者サービスによるもので、以下に説明します。',
 sec:[
 ["開発者が収集する情報","ありません。本アプリにはアカウントやログインがなく、独自の分析も行わず、お客様の情報を開発者に送信しません。すべてのシミュレーションはお客様のデバイス上でオフラインで実行されます。"],
["Game Center（Apple）","ランキングにはAppleのGame Centerを使用します。サインインすると、Game Centerのアカウントとニックネームはappleが管理します。アプリはプレー結果のスコアを送信してランキングに反映し、ランキングを読み取って表示します。開発者がGame Center経由で個人情報を受け取ることはありません（Appleが自社のプライバシーポリシーに基づいて取り扱います："+AP+"）。ベストプレーと保存したプレーは端末内にのみ保存され、アップロードされることはありません。"],
 ["広告（Google AdMob）","本アプリは Google AdMob を通じて広告を表示します。広告の配信と測定のために、Google はデバイス識別子、IP アドレス、おおよその位置情報、アプリ操作データなどの情報を収集・処理し、許可される範囲でパーソナライズ広告の表示に使用する場合があります。Google によるこれらのデータの取り扱いは、Google のプライバシーポリシー（"+G1+"）および「Google がサービスを使用するサイトやアプリからの情報をどのように使用するか」（"+G2+"）に準拠します。"],
 ["Appのトラッキングの透明性（Apple）","初回起動時、本アプリは Apple のトラッキングの透明性の確認を使用して、広告目的のトラッキングを許可するかどうかを尋ねます。拒否した場合、表示される広告はパーソナライズされません。この選択は iOS の<em>設定 → プライバシーとセキュリティ → トラッキング</em>でいつでも変更できます。"],
 ["同意（EEA、英国および類似の地域）","法律で義務付けられている場合（例：EEA および英国の GDPR）、本アプリは起動時に Google 提供の同意フォームを表示し、広告が表示される前に広告のパーソナライズに関する選択を行えるようにします。"],
 ["アプリ内課金","「広告を非表示」の購入は、App Store を通じて Apple が完全に処理する一回限りのアプリ内課金です。Apple がすべての支払い情報を処理し、開発者がお客様の支払い情報を受け取ったり保存したりすることはありません。Apple のプライバシーポリシー（"+AP+"）をご覧ください。"],
 ["子ども","本アプリは13歳未満の子どもを対象としておらず、開発者が子どもから故意に個人情報を収集することはありません。"],
 ["お客様の権利","お住まいの地域によっては（例：GDPR やカリフォルニア州の CCPA/CPRA）、お客様に関して保持されている個人データにアクセス、訂正、削除する権利がある場合があります。開発者は個人データを保持していないため、返却、訂正、削除するものはありません。広告データについては、上記の管理方法（トラッキングの拒否または同意の変更）をご利用いただき、上記にリンクした Google および Apple のポリシーをご参照ください。"],
 ["データの保持とセキュリティ","開発者は個人データを保存しないため、当社側で保持されるものはありません。"],
 ["本ポリシーの変更","本ポリシーは随時更新される場合があります。更新は新しい「最終更新」の日付とともにこのページに掲載されます。"],
 ["お問い合わせ","本ポリシーに関するご質問は、"+EMAIL+" までご連絡ください。"]],
 disc:"PitchWhich は独立したサッカーシミュレーションです。FIFA やその他のサッカー団体、リーグ、クラブと提携・承認・後援関係にありません。"},

"ko": {dir:"ltr", pick:"언어:", title:"PitchWhich — 개인정보 처리방침", updated:"최종 업데이트: 2026년 8월 13일",
 intro:'PitchWhich(이하 “앱”)은 축구 토너먼트 시뮬레이터입니다. 이 방침은 귀하의 정보가 어떻게 처리되는지 설명합니다. 요약하면, <strong>앱은 전적으로 귀하의 기기에서 실행되며, 당사(개발자)는 귀하에 관한 어떠한 개인정보도 수집, 저장하거나 접근하지 않습니다.</strong> 유일한 데이터 처리는 광고 및 결제에 사용되는 제3자 서비스에서 이루어지며, 아래에 설명되어 있습니다.',
 sec:[
 ["개발자가 수집하는 정보","없습니다. 앱에는 계정이나 로그인이 없고, 자체 분석을 수행하지 않으며, 귀하의 정보를 개발자에게 전송하지 않습니다. 모든 시뮬레이션은 귀하의 기기에서 오프라인으로 실행됩니다."],
["Game Center(Apple)","순위표는 Apple의 Game Center를 사용합니다. 로그인하면 Game Center 계정과 별명은 Apple이 관리하며, 앱은 플레이 점수를 전송해 순위에 반영하고 순위표를 읽어 표시합니다. 개발자는 Game Center를 통해 어떠한 개인정보도 받지 않습니다. Apple이 자체 정책에 따라 처리합니다("+AP+"). 최고 플레이와 저장한 플레이는 기기에만 저장되며 업로드되지 않습니다."],
 ["광고(Google AdMob)","앱은 Google AdMob을 통해 광고를 표시합니다. 광고를 게재하고 측정하기 위해 Google은 기기 식별자, IP 주소, 대략적인 위치, 앱 상호작용 데이터와 같은 정보를 수집·처리할 수 있으며, 허용되는 경우 맞춤형 광고를 표시하는 데 사용할 수 있습니다. Google의 이러한 데이터 처리는 Google 개인정보처리방침("+G1+") 및 「Google이 서비스를 사용하는 사이트나 앱의 정보를 사용하는 방식」("+G2+")의 적용을 받습니다."],
 ["앱 추적 투명성(Apple)","최초 실행 시 앱은 Apple의 앱 추적 투명성 요청을 사용하여 광고를 위한 추적을 허용할지 묻습니다. 거부하면 표시되는 광고는 맞춤형이 아닙니다. 이 선택은 iOS <em>설정 → 개인정보 보호 및 보안 → 추적</em>에서 언제든지 변경할 수 있습니다."],
 ["동의(EEA, 영국 및 유사 지역)","법으로 요구되는 경우(예: EEA 및 영국의 GDPR), 앱은 실행 시 Google이 제공하는 동의 양식을 표시하여 광고가 표시되기 전에 광고 맞춤설정에 대한 선택을 할 수 있도록 합니다."],
 ["인앱 구매","「광고 제거」 구매는 App Store를 통해 Apple이 전적으로 처리하는 일회성 인앱 구매입니다. Apple이 모든 결제 정보를 처리하며, 개발자는 귀하의 결제 정보를 받거나 저장하지 않습니다. Apple 개인정보처리방침("+AP+")을 참조하십시오."],
 ["아동","앱은 만 13세 미만 아동을 대상으로 하지 않으며, 개발자는 아동으로부터 고의로 개인정보를 수집하지 않습니다."],
 ["귀하의 권리","거주 지역에 따라(예: GDPR 또는 캘리포니아 CCPA/CPRA), 귀하에 관해 보유된 개인정보에 접근, 정정 또는 삭제할 권리가 있을 수 있습니다. 개발자는 개인정보를 보유하지 않으므로 반환, 정정 또는 삭제할 것이 없습니다. 광고 데이터의 경우 위에 설명된 제어(추적 거부 또는 동의 변경)를 사용하고 위에 링크된 Google 및 Apple의 방침을 참조하십시오."],
 ["데이터 보존 및 보안","개발자는 개인정보를 저장하지 않으므로 당사 측에 보존되는 것이 없습니다."],
 ["본 방침의 변경","당사는 본 방침을 수시로 업데이트할 수 있습니다. 업데이트는 새로운 「최종 업데이트」 날짜와 함께 이 페이지에 게시됩니다."],
 ["문의","본 방침에 대한 문의는 "+EMAIL+"로 연락해 주십시오."]],
 disc:"PitchWhich은 독립적인 축구 시뮬레이션입니다. FIFA 또는 기타 축구 단체, 리그, 클럽과 제휴, 보증 또는 후원 관계가 없습니다."},

"zh-Hans": {dir:"ltr", pick:"语言：", title:"PitchWhich — 隐私政策", updated:"最后更新：2026年8月13日",
 intro:'PitchWhich（“本应用”）是一款足球锦标赛模拟器。本政策说明如何处理您的信息。简而言之，<strong>本应用完全在您的设备上运行，我们（开发者）不会收集、存储或访问有关您的任何个人信息。</strong>唯一的数据处理来自用于广告和支付的第三方服务，如下所述。',
 sec:[
 ["开发者收集的信息","无。本应用没有账户或登录，不进行自身的分析，也不会将您的任何信息发送给开发者。所有模拟均在您的设备上离线运行。"],
 ["Game Center（Apple）","排行榜使用 Apple 的 Game Center。如果你登录，Apple 会处理你的 Game Center 账户和昵称；应用会提交你的比赛得分以便排名，并读取排行榜来显示。开发者不会通过 Game Center 获得任何个人信息，Apple 会，依据其自身的隐私政策（"+AP+"）。你的最佳战绩和已保存的比赛仅存放在你的设备上，绝不会上传。"],
 ["广告（Google AdMob）","本应用通过 Google AdMob 展示广告。为投放和衡量广告，Google 可能会收集和处理设备标识符、IP 地址、粗略位置和应用互动数据等信息，并在允许的情况下用于展示个性化广告。Google 对这些数据的处理受 Google 隐私政策（"+G1+"）以及《Google 如何使用来自使用其服务的网站或应用的信息》（"+G2+"）的约束。"],
 ["应用跟踪透明度（Apple）","首次启动时，本应用使用 Apple 的应用跟踪透明度提示，询问您是否允许出于广告目的进行跟踪。若您拒绝，您看到的广告将为非个性化广告。您可随时在 iOS <em>设置 → 隐私与安全性 → 跟踪</em>中更改此选择。"],
 ["同意（欧洲经济区、英国及类似地区）","在法律要求的情况下（例如欧洲经济区和英国的 GDPR），本应用会在启动时显示由 Google 提供的同意表单，以便您在展示广告之前就广告个性化做出选择。"],

"ar": {dir:"rtl", pick:"اللغة:", title:"PitchWhich — سياسة الخصوصية", updated:"آخر تحديث: 13 أغسطس 2026",
 intro:'PitchWhich («التطبيق») هو محاكي بطولات كرة قدم. توضح هذه السياسة كيفية التعامل مع معلوماتك. باختصار: <strong>يعمل التطبيق بالكامل على جهازك، ونحن (المطوّر) لا نجمع أو نخزّن أو نصل إلى أي معلومات شخصية عنك.</strong> المعالجة الوحيدة للبيانات تأتي من خدمات الطرف الثالث المستخدمة للإعلانات والمدفوعات، الموضّحة أدناه.',
 sec:[
 ["المعلومات التي يجمعها المطوّر","لا شيء. لا يحتوي التطبيق على حساب أو تسجيل دخول، ولا يجري أي تحليلات خاصة به، ولا يرسل أيًّا من معلوماتك إلى المطوّر. تُجرى جميع المحاكاة دون اتصال على جهازك."],
 ["Game Center (Apple)","تستخدم لوحات الصدارة خدمة Game Center من Apple. إذا سجّلت الدخول، فإن Apple هي التي تتولى حسابك واسمك المستعار في Game Center؛ ويرسل التطبيق نتائج جولاتك لترتيبها، ويقرأ اللوحات لعرضها. لا يحصل المطوّر على أي معلومات شخصية عبر Game Center؛ بل تحصل عليها Apple وفق سياستها الخاصة ("+AP+"). أما أفضل جولاتك والجولات المحفوظة فتُخزَّن على جهازك فقط ولا تُرفَع أبدًا."],
 ["الإعلانات (Google AdMob)","يعرض التطبيق إعلانات عبر Google AdMob. لعرض الإعلانات وقياسها، قد تجمع Google وتعالج معلومات مثل معرّفات الجهاز وعنوان IP والموقع التقريبي وبيانات التفاعل مع التطبيق، وقد تستخدمها لعرض إعلانات مخصّصة حيثما يُسمح بذلك. تخضع معالجة Google لهذه البيانات لسياسة خصوصية Google ("+G1+") و«كيف تستخدم Google المعلومات من المواقع أو التطبيقات التي تستخدم خدماتها» ("+G2+")."],
 ["شفافية تتبّع التطبيقات (Apple)","عند التشغيل الأول، يستخدم التطبيق مطالبة شفافية تتبّع التطبيقات من Apple لسؤالك عمّا إذا كنت تسمح بالتتبّع لأغراض الإعلانات. إذا رفضت، فستكون الإعلانات التي تراها غير مخصّصة. يمكنك تغيير هذا الخيار في أي وقت من <em>الإعدادات → الخصوصية والأمان → التتبّع</em> في iOS."],
 ["الموافقة (المنطقة الاقتصادية الأوروبية والمملكة المتحدة والمناطق المماثلة)","حيثما يقتضي القانون (على سبيل المثال بموجب اللائحة العامة لحماية البيانات في المنطقة الاقتصادية الأوروبية والمملكة المتحدة)، يعرض التطبيق عند التشغيل نموذج موافقة توفّره Google لتتمكّن من اتخاذ خياراتك بشأن تخصيص الإعلانات قبل عرضها."],
 ["عمليات الشراء داخل التطبيق","عملية شراء «إزالة الإعلانات» هي عملية شراء لمرة واحدة داخل التطبيق تعالجها Apple بالكامل عبر App Store. تتولى Apple جميع معلومات الدفع؛ ولا يتلقّى المطوّر أو يخزّن أبدًا تفاصيل الدفع الخاصة بك. راجع سياسة خصوصية Apple ("+AP+")."],
 ["الأطفال","التطبيق غير موجّه للأطفال دون سن 13 عامًا، ولا يجمع المطوّر عن قصد معلومات شخصية من الأطفال."],
 ["حقوقك","بحسب مكان إقامتك (على سبيل المثال بموجب اللائحة العامة لحماية البيانات أو قانون CCPA/CPRA في كاليفورنيا)، قد تكون لديك حقوق في الوصول إلى البيانات الشخصية المحفوظة عنك أو تصحيحها أو حذفها. ولأن المطوّر لا يحتفظ بأي بيانات شخصية، فليس لدينا ما نُعيده أو نصحّحه أو نحذفه. أمّا بالنسبة لبيانات الإعلانات، فيرجى استخدام الضوابط الموضّحة أعلاه (رفض التتبّع أو تعديل موافقتك) والرجوع إلى سياستَي Google وApple المرتبطتين أعلاه."],
 ["الاحتفاظ بالبيانات وأمنها","لا يخزّن المطوّر أي بيانات شخصية، لذا لا يُحتفظ بأي شيء من جانبنا."],
 ["التغييرات على هذه السياسة","قد نحدّث هذه السياسة من حين لآخر. ستُنشر التحديثات على هذه الصفحة مع تاريخ «آخر تحديث» جديد."],
 ["التواصل","أسئلة حول هذه السياسة؟ تواصل عبر: "+EMAIL]],

function render(code){
  var t = T[code] || T.en;
  document.documentElement.lang = code;
  document.documentElement.dir = t.dir;
  document.body.dir = t.dir;
  document.getElementById('lang').previousElementSibling.textContent = t.pick;
  var h = '<h1>'+t.title+'</h1><p class="muted">'+t.updated+'</p><p>'+t.intro+'</p>';
  for (var i=0;i<t.sec.length;i++){ h += '<h2>'+t.sec[i][0]+'</h2><p>'+t.sec[i][1]+'</p>'; }
  h += '<p class="muted">'+t.disc+'</p>';
  document.getElementById('doc').innerHTML = h;
  document.title = t.title;
}
function pickLang(){
  var want = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||'en']);
  for (var i=0;i<want.length;i++){
    var l = want[i];
    if (T[l]) return l;                              // exact (e.g. zh-Hant)
    var base = l.split('-')[0];
    if (base==='zh'){ return /Hant|TW|HK|MO/i.test(l) ? 'zh-Hant' : 'zh-Hans'; }
    if (T[base]) return base;                        // language part (e.g. fr-CA -> fr)
  }
  return 'en';
}
var sel = document.getElementById('lang');
var initial = pickLang();
sel.value = initial;
sel.addEventListener('change', function(){ render(sel.value); });
render(initial);
</script>
